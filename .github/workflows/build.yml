name: Build CV

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Serialize each branch's complete run so an older slow build cannot deploy last.
concurrency:
  group: cv-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repository_checks:
    name: Repository documentation checks
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install check dependencies
        run: python3 -m pip install --retries 5 --timeout 30 -r pip_requirements-dev.txt
      # Keep failures visible without blocking a valid CV over unrelated maintainer docs.
      - name: Check non-CV documentation
        shell: bash
        run: |
          source source_me.sh
          python3 -m pytest tests/test_ascii_compliance.py tests/test_markdown_links.py tests/test_whitespace.py -k 'not cv/' --no-ascii-fix

  documents:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'pip_requirements*.txt'
      - name: Install document tools
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y pandoc libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
          python3 -m pip install --retries 5 --timeout 30 -r pip_requirements.txt -r pip_requirements-dev.txt
      - name: Check CV sources and conversion
        shell: bash
        run: source source_me.sh && python3 -m pytest tests/ -k 'cv/ or test_cv_build' --no-ascii-fix
      - name: Build documents
        shell: bash
        run: source source_me.sh && python3 build_cv.py
      - uses: actions/upload-artifact@v7
        # Downloadable CI artifacts are optional; the separate Pages artifact is required.
        continue-on-error: true
        with:
          name: neil-voss-cv
          path: |
            output/pdf/neil_voss_cv.pdf
            output/neil_voss_cv.docx
            output/CV.md
          if-no-files-found: error
      - name: Upload Pages site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: output/site

  deploy:
    needs: documents
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # ASVS 8.2.1: only the main-branch deployment receives publication permissions.
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
